name: Vendor Due Diligence CI

on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify deterministic TPRM engine
        run: python verify.py

      - name: Import FastAPI application
        run: python -c "from api.index import app; assert app.title"
